<main class="mx-auto max-w-4xl px-5 py-10 sm:px-8">
	<header class="border-b border-slate-200 pb-6">
		<p class="text-xs font-semibold uppercase tracking-widest text-emerald-700">Account</p>
		<h1 class="mt-2 text-3xl font-semibold text-slate-900">Claims Manager profile</h1>
	</header>
	<section class="mt-8 rounded-lg border border-slate-200 bg-white p-6">
		<dl class="grid gap-5 sm:grid-cols-2">
			<div><dt class="text-xs font-semibold uppercase text-slate-500">Account email</dt><dd class="mt-1 text-slate-900">{{ user()?.email }}</dd></div>
			<div><dt class="text-xs font-semibold uppercase text-slate-500">Role</dt><dd class="mt-1 text-slate-900">Claims Manager</dd></div>
		</dl>
		<div class="mt-7 flex flex-wrap gap-3 border-t border-slate-100 pt-5">
			<a routerLink="/account/security/change-password" class="rounded-md bg-slate-900 px-4 py-3 text-sm font-semibold text-white hover:bg-slate-700">Change password</a>
			<a routerLink="/account/security/mfa" class="rounded-md border border-slate-300 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">Manage MFA</a>
		</div>
	</section>
</main>
